<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="/css/app.css"/>
<script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d8e3fb",
                        "surface-bright": "#f9f9ff",
                        "inverse-primary": "#c3c0ff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#4f46e5",
                        "on-tertiary-container": "#93e8ff",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-fixed-dim": "#4cd7f6",
                        "inverse-surface": "#263143",
                        "secondary-fixed-dim": "#ddb8ff",
                        "on-primary-fixed-variant": "#3323cc",
                        "outline-variant": "#c7c4d8",
                        "on-surface": "#111c2d",
                        "inverse-on-surface": "#ecf1ff",
                        "on-secondary-fixed": "#2c0051",
                        "error-container": "#ffdad6",
                        "surface": "#f9f9ff",
                        "secondary-container": "#9e41f5",
                        "on-surface-variant": "#464555",
                        "on-error-container": "#93000a",
                        "background": "#f9f9ff",
                        "primary": "#3525cd",
                        "on-tertiary-fixed-variant": "#004e5c",
                        "tertiary": "#00505f",
                        "surface-container": "#e7eeff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-tertiary-fixed": "#001f26",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "surface-variant": "#d8e3fb",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#f0dbff",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#dad7ff",
                        "secondary": "#831ada",
                        "on-secondary-container": "#fffbff",
                        "on-background": "#111c2d",
                        "surface-dim": "#cfdaf2",
                        "outline": "#777587",
                        "on-error": "#ffffff",
                        "tertiary-container": "#006a7c",
                        "surface-container-high": "#dee8ff",
                        "on-secondary-fixed-variant": "#6800b4",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "tertiary-fixed": "#acedff",
                        "surface-tint": "#4d44e3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sm": "12px",
                        "base": "8px",
                        "md": "16px",
                        "gutter": "16px",
                        "xl": "32px",
                        "2xl": "48px",
                        "margin": "20px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Spline Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-xl": ["Spline Sans"],
                        "headline-lg": ["Spline Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "30px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 border-b border-slate-200/50 dark:border-slate-800/50 bg-white/70 backdrop-blur-xl flex items-center justify-between px-4 h-16 shadow-[0_4px_12px_rgba(79,70,229,0.08)]">
<button onclick="history.back()" class="active:scale-95 transition-transform duration-200 text-indigo-600 p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Spline_Sans'] font-bold text-lg text-indigo-600 flex items-center gap-2 justify-center"><img src="/images/skillswap-logo.png" alt="" width="128" height="128" class="h-7 w-auto object-contain" aria-hidden="true"/>İlan Detayı</h1>
<div class="w-10"></div>
</header>
<main class="pt-20 px-margin space-y-lg">

<!-- Hero Card -->
<div class="relative rounded-3xl overflow-hidden shadow-lg bg-gradient-to-br from-primary via-indigo-600 to-secondary p-6 pt-8 pb-6">
  <!-- Decorative blobs -->
  <div class="absolute -top-8 -right-8 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
  <div class="absolute -bottom-6 -left-6 w-32 h-32 bg-secondary/30 rounded-full blur-2xl pointer-events-none"></div>

  <div class="relative z-10 flex items-center gap-4">
    <!-- Avatar -->
    <img id="tutor-avatar" src="https://ui-avatars.com/api/?name=?&background=ffffff&color=4f46e5&size=128"
         class="w-20 h-20 rounded-2xl object-cover border-4 border-white/30 shadow-lg flex-shrink-0"/>
    <!-- Info -->
    <div class="flex-grow min-w-0">
      <h2 id="listing-title" class="font-['Spline_Sans'] font-bold text-white text-xl leading-tight mb-1">—</h2>
      <p id="listing-tutor-name" class="text-white/80 font-label-md text-sm">—</p>
      <!-- Badges -->
      <div class="flex flex-wrap gap-2 mt-3">
        <span class="px-sm py-1 bg-white/20 backdrop-blur text-white font-label-sm rounded-full text-xs" id="hero-category">—</span>
        <span class="px-sm py-1 bg-white/20 backdrop-blur text-white font-label-sm rounded-full text-xs" id="hero-mode">—</span>
      </div>
    </div>
  </div>
</div>
<!-- Description -->
<div class="glass-card p-md rounded-xl border border-outline-variant/30 space-y-sm shadow-sm">
<h3 class="font-label-md text-secondary">Hakkında</h3>
<p id="listing-description" class="font-body-md text-on-surface-variant leading-relaxed">—</p>
</div>
<!-- Logistics Bento Grid -->
<div class="grid grid-cols-2 gap-md">
<div class="bg-surface-container p-md rounded-xl space-y-xs flex flex-col items-start shadow-[0_4px_12px_rgba(79,70,229,0.04)]">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<p class="font-label-sm text-primary uppercase">Tarih Aralığı</p>
<p id="listing-dates" class="font-label-md text-on-surface">—</p>
</div>
<div class="bg-surface-container p-md rounded-xl space-y-xs flex flex-col items-start shadow-[0_4px_12px_rgba(79,70,229,0.04)]">
<span class="material-symbols-outlined text-primary">schedule</span>
<p class="font-label-sm text-primary uppercase">Saat Aralığı</p>
<p id="listing-times" class="font-label-md text-on-surface">—</p>
</div>
<div class="bg-surface-container p-md rounded-xl space-y-xs flex flex-col items-start shadow-[0_4px_12px_rgba(79,70,229,0.04)]">
<span class="material-symbols-outlined text-primary">repeat</span>
<p class="font-label-sm text-primary uppercase">Sıklık</p>
<p id="listing-freq" class="font-label-md text-on-surface">—</p>
</div>
<div class="bg-surface-container p-md rounded-xl space-y-xs flex flex-col items-start shadow-[0_4px_12px_rgba(79,70,229,0.04)]">
<span class="material-symbols-outlined text-primary">videocam</span>
<p class="font-label-sm text-primary uppercase">Ders Şekli</p>
<p id="listing-mode" class="font-label-md text-on-surface">—</p>
</div>
</div>
<!-- Skill Progress Preview -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<h3 class="font-label-md text-on-surface">Öğrenme Yolu</h3>
<span class="font-label-sm text-secondary">Seviye 2</span>
</div>
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-[65%] bg-gradient-to-r from-primary to-secondary rounded-full shadow-[0_0_8px_rgba(79,70,229,0.4)]"></div>
</div>
<p class="font-body-sm text-on-surface-variant">Bu dersi tamamladığında "Ritm Ustası" rozetine bir adım daha yaklaşacaksın.</p>
</div>
<!-- Tutor Card -->
<div class="flex items-center gap-md p-md bg-white rounded-2xl shadow-sm border border-slate-100" id="tutor-card">
<img id="tutor-avatar" alt="Tutor" class="w-14 h-14 rounded-full object-cover ring-2 ring-secondary/20" src="https://ui-avatars.com/api/?name=?&background=4f46e5&color=fff&size=128"/>
<div class="flex-1">
<h4 class="font-label-md text-on-surface" id="tutor-name">—</h4>
<p class="font-body-sm text-on-surface-variant" id="tutor-rating">—</p>
</div>
<button id="btn-view-profile" class="px-md py-base font-label-sm text-primary border border-primary rounded-xl active:scale-95 transition-all">Profili Gör</button>
</div>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 right-0 z-50 px-6 pb-8 pt-4 bg-white/80 backdrop-blur-2xl border-t border-slate-200/50 shadow-[0_-4px_16px_rgba(79,70,229,0.12)]">
<div class="flex gap-3">
<button id="btn-join" class="flex-grow h-[48px] bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-['Spline_Sans'] font-semibold text-base rounded-xl shadow-lg shadow-indigo-500/30 active:scale-[0.97] transition-all flex items-center justify-center hover:opacity-90">
  İletişime Geç
</button>
<button id="btn-report" class="w-12 h-12 rounded-xl border-2 border-red-200 text-red-400 flex items-center justify-center active:scale-95 transition-all hover:bg-red-50" title="Şikayet Et">
  <span class="material-symbols-outlined text-[20px]">flag</span>
</button>
</div>
</footer>
<script type="module" src="/js/pages/listing.js?v=8"></script>
</body></html>
