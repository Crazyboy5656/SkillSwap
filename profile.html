<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillSwap Teens - Profil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#4cd7f6",
                        "secondary-container": "#9e41f5",

                        "background": "#f9f9ff",
                        "secondary-fixed": "#f0dbff",
                        "on-secondary": "#ffffff",
                        "outline": "#777587",
                        "surface-dim": "#cfdaf2",
                        "surface-variant": "#d8e3fb",
                        "surface-bright": "#f9f9ff",

                        "inverse-surface": "#263143",
                        "primary-fixed": "#e2dfff",

<style>
        body {
            background-color: #f9f9ff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #111c2d;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .profile-gradient-bg {
            background: linear-gradient(135deg, #4f46e5 0%, #831ada 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style id="nav-active-style">
[data-nav-id="nav-profile"] { color: #4f46e5 !important; }
[data-nav-id="nav-profile"] .nav-icon { background: rgba(79,70,229,0.13) !important; font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24 !important; }
[data-nav-id="nav-profile"] .nav-label { font-weight: 800 !important; color: #4f46e5 !important; }
</style>
</head>
<body class="pb-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md border-b border-slate-200/50 shadow-[0_4px_20px_rgba(79,70,229,0.08)]">
<button class="material-symbols-outlined text-indigo-600 active:scale-95 transition-transform duration-200 p-2 rounded-full hover:bg-indigo-50/50" onclick="history.back()">arrow_back</button>
<h1 class="font-['Spline_Sans'] font-semibold text-lg text-indigo-600 flex items-center gap-2"><img src="/images/skillswap-logo.png" alt="" width="128" height="128" class="h-8 w-auto object-contain" aria-hidden="true"/>Profil</h1>
<button class="material-symbols-outlined text-indigo-600 active:scale-95 transition-transform duration-200 p-2 rounded-full hover:bg-indigo-50/50 relative" onclick="location.href='/notifications'">
  notifications
  <span id="notif-badge" class="absolute top-1 right-1 min-w-[14px] h-3.5 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center px-0.5" hidden>0</span>
</button>
</header>
<main class="mt-20 px-margin space-y-lg">
<!-- Profile Header Section -->
<section class="relative">
<div class="h-32 w-full rounded-[32px] profile-gradient-bg opacity-90"></div>
<div class="flex flex-col items-center -mt-16 px-4">
<div class="relative">
<div class="w-32 h-32 rounded-full border-4 border-white overflow-hidden shadow-xl" id="avatar-wrapper">
<img id="profile-avatar" alt="Profile Photo" class="w-full h-full object-cover" src="https://ui-avatars.com/api/?name=?&background=4f46e5&color=fff&size=128"/>
</div>
<div class="absolute bottom-1 right-1 bg-green-500 w-6 h-6 border-4 border-white rounded-full" id="online-dot"></div>
<!-- Hidden file input for avatar upload -->
<label for="avatar-input" class="absolute bottom-1 left-1 w-6 h-6 bg-primary rounded-full border-2 border-white flex items-center justify-center cursor-pointer">
  <span class="material-symbols-outlined text-white text-[12px]">edit</span>
</label>
<input type="file" id="avatar-input" accept="image/*" class="hidden"/>
</div>
<div class="mt-4 text-center">
<h2 class="font-headline-md text-headline-md text-on-background" id="profile-name">—</h2>
<p class="font-label-md text-label-md text-primary mt-1" id="profile-handle">@—</p>
</div>
</div>
</section>
<!-- Bio Section -->
<section class="glass-card p-md rounded-[24px] shadow-sm relative">
<div class="flex justify-between items-start">
<div class="space-y-2">
<h3 class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Hakkımda</h3>
<p class="font-body-md text-body-md text-on-surface-variant pr-8" id="profile-bio">—</p>
</div>
<button class="material-symbols-outlined text-indigo-600 p-1 hover:bg-indigo-50 rounded-lg transition-colors" id="btn-edit-profile">edit_note</button>
</div>
</section>
<!-- Ratings Section - Bento Style -->
<section class="grid grid-cols-2 gap-gutter">
<div class="glass-card p-md rounded-[24px] flex flex-col items-center justify-center text-center space-y-2 border-l-4 border-l-primary">
<span class="font-label-sm text-label-sm text-outline">Öğrenci Puanı</span>
<div class="flex items-center text-primary">
<span class="text-headline-md font-headline-md mr-1" id="learner-rating">—</span>
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<span class="font-label-sm text-outline" id="learner-count">0 değerlendirme</span>
</div>
<div class="glass-card p-md rounded-[24px] flex flex-col items-center justify-center text-center space-y-2 border-l-4 border-l-secondary">
<span class="font-label-sm text-label-sm text-outline">Eğitmen Puanı</span>
<div class="flex items-center text-secondary">
<span class="text-headline-md font-headline-md mr-1" id="tutor-rating">—</span>
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<span class="font-label-sm text-outline" id="tutor-count">0 değerlendirme</span>
</div>
</section>
<!-- Reviews Section -->
<section id="reviews-section" class="space-y-md hidden">
  <div class="flex items-center justify-between">
    <h3 class="font-headline-md text-headline-md">Yorumlar</h3>
    <div class="flex items-center gap-2">
      <span id="reviews-count-badge" class="text-outline font-label-sm text-sm"></span>
      <button id="btn-write-review" class="hidden px-3 py-1.5 rounded-full bg-primary text-white font-label-sm text-[12px] flex items-center gap-1 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[14px]">rate_review</span> Yorum Yaz
      </button>
    </div>
  </div>
  <!-- AI Analysis Card -->
  <div id="ai-review-section" class="glass-card p-md rounded-[24px] shadow-sm bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100">
    <div class="flex items-center gap-2 mb-3">
      <span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings:'FILL' 1">auto_awesome</span>
      <h3 class="font-label-sm text-label-sm text-primary uppercase tracking-widest">AI Yorum Özeti</h3>
    </div>
    <p id="ai-review-text" class="font-body-md text-on-surface-variant text-sm mb-3 hidden leading-relaxed italic"></p>
    <button id="ai-analyze-btn" class="w-full h-10 rounded-xl bg-gradient-to-r from-primary to-secondary text-white font-label-md flex items-center justify-center gap-2 transition-all active:scale-95 shadow-sm">
      <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
      AI ile Analiz Et
    </button>
  </div>
  <!-- Individual review cards -->
  <div id="reviews-list" class="space-y-3"></div>
</section>
<!-- Active Lessons Section -->
<section class="space-y-md">
<div class="flex justify-between items-center">
<h3 class="font-headline-md text-headline-md">Aktif Eğitimler</h3>
<button class="text-primary font-label-md" onclick="document.getElementById('active-listings').scrollIntoView({behavior:'smooth',block:'start'})">Hepsini Gör</button>
</div>
<div id="active-listings" class="space-y-md">
  <div class="skeleton h-24 rounded-[28px]"></div>
  <div class="skeleton h-24 rounded-[28px]"></div>
</div>
</section>

<!-- Logout button -->
<section class="pb-8">
<button data-action="logout" class="w-full h-12 rounded-xl border-2 border-red-200 text-red-500 font-label-md flex items-center justify-center gap-2 hover:bg-red-50 transition-all">
<span class="material-symbols-outlined">logout</span> Çıkış Yap
</button>
</section>
</main>
<!-- FAB for Create -->
<button class="fixed bottom-20 right-6 w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-300 flex items-center justify-center active:scale-90 transition-transform duration-200 z-40" onclick="location.href='/create'">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 h-[72px] bg-white border-t border-slate-100 shadow-[0_-1px_10px_rgba(0,0,0,0.06)]">
  <a data-nav-id="nav-home" href="/home" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">home</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Ana Sayfa</span>
  </a>
  <a data-nav-id="nav-search" href="/listings" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">search</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Keşfet</span>
  </a>
  <a data-nav-id="nav-create" href="/create" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">add_box</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Oluştur</span>
  </a>
  <a data-nav-id="nav-messages" href="/chat" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">chat</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Mesajlar</span>
  </a>
  <a data-nav-id="nav-profile" href="/profile" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">account_circle</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Profilim</span>
  </a>
</nav>
<script type="module" src="/js/pages/profile.js?v=10"></script>
</body></html>
