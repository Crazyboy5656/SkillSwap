<!DOCTYPE html>
<html class="light" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillSwap — Becerilerini Seç</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css"/>
<script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: { "primary": "#3525cd", "secondary": "#831ada", "primary-container": "#4f46e5", "on-primary": "#ffffff", "surface": "#f9f9ff", "surface-container-low": "#f0f3ff", "surface-container": "#e7eeff", "surface-container-high": "#dee8ff", "on-surface": "#111c2d", "on-surface-variant": "#464555", "outline-variant": "#c7c4d8", "outline": "#777587", "background": "#f9f9ff" },
    fontFamily: { "headline-xl": ["Spline Sans"], "headline-lg": ["Spline Sans"], "headline-md": ["Spline Sans"], "body-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
    fontSize: { "headline-xl": ["40px",{"lineHeight":"48px","fontWeight":"700"}], "headline-lg": ["32px",{"lineHeight":"38px","fontWeight":"700"}], "headline-md": ["24px",{"lineHeight":"30px","fontWeight":"600"}], "body-md": ["16px",{"lineHeight":"24px","fontWeight":"400"}], "body-sm": ["14px",{"lineHeight":"20px","fontWeight":"400"}], "label-md": ["14px",{"lineHeight":"18px","fontWeight":"600"}], "label-sm": ["12px",{"lineHeight":"16px","fontWeight":"700"}] },
    spacing: { "xs":"4px","sm":"12px","base":"8px","md":"16px","lg":"24px","xl":"32px","2xl":"48px","margin":"20px","gutter":"16px" }
  }}
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { min-height: max(884px, 100dvh); }
  .skill-chip { cursor: pointer; transition: all 0.15s; }
  .skill-chip.selected { background: #3525cd; color: #fff; border-color: #3525cd; }
</style>
</head>
<body class="bg-background font-body-md text-on-surface pb-32">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/50 flex items-center justify-between px-5 h-16 shadow-sm">
  <img src="/images/skillswap-logo.png" alt="SkillSwap" width="160" height="160" class="h-10 w-auto object-contain"/>
  <span class="font-label-sm text-outline" id="step-label">Adım 1/3</span>
</header>

<main class="pt-24 px-5 max-w-lg mx-auto">

  <!-- Progress bar -->
  <div class="h-2 w-full bg-surface-container-high rounded-full mb-6">
    <div id="progress-bar" class="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-500 progress-glow" style="width:33%"></div>
  </div>

  <!-- Step 1: Pick skills to TEACH -->
  <div id="step-1">
    <h1 class="font-headline-md text-headline-md text-on-surface mb-1">Neleri öğretebilirsin? 🎓</h1>
    <p class="text-on-surface-variant text-body-sm mb-6">En az 1 yetenek seç. Başkalarına öğreteceğin şeyler.</p>
    <div id="teach-chips" class="flex flex-wrap gap-3 min-h-[80px]">
      <div class="skeleton w-20 h-9 rounded-full"></div>
      <div class="skeleton w-28 h-9 rounded-full"></div>
      <div class="skeleton w-16 h-9 rounded-full"></div>
    </div>
  </div>

  <!-- Step 2: Pick interest categories (hidden) -->
  <div id="step-2" class="hidden">
    <h1 class="font-headline-md text-headline-md text-on-surface mb-1">İlgi alanların neler? 🌟</h1>
    <p class="text-on-surface-variant text-body-sm mb-6">En az 1 kategori seç. Sana özel içerik gösterelim.</p>
    <div id="interest-chips" class="flex flex-wrap gap-3 min-h-[80px]"></div>
  </div>

  <!-- Step 3: Profile setup (hidden) -->
  <div id="step-3" class="hidden">
    <h1 class="font-headline-md text-headline-md text-on-surface mb-1">Profilini tamamla ✨</h1>
    <p class="text-on-surface-variant text-body-sm mb-6">Seni başkalarına tanıtalım.</p>
    <div class="space-y-4">
      <div>
        <label class="font-label-md block mb-1 text-on-surface-variant ml-1">Görünür Ad</label>
        <input id="display-name" type="text" placeholder="Adın veya takma adın" class="w-full h-12 px-4 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary outline-none font-body-md"/>
      </div>
      <div>
        <label class="font-label-md block mb-1 text-on-surface-variant ml-1">Hakkında (opsiyonel)</label>
        <textarea id="bio" rows="3" placeholder="Kendinden bahset..." class="w-full p-4 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary outline-none font-body-md resize-none"></textarea>
      </div>
      <div>
        <label class="font-label-md block mb-1 text-on-surface-variant ml-1">Şehir (opsiyonel)</label>
        <input id="location" type="text" placeholder="İstanbul, Ankara..." class="w-full h-12 px-4 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary outline-none font-body-md"/>
      </div>
    </div>
  </div>

</main>

<!-- Fixed bottom CTA -->
<div class="fixed bottom-0 left-0 w-full p-5 bg-white/80 backdrop-blur-md border-t border-slate-100 z-40">
  <div class="max-w-lg mx-auto flex gap-3">
    <button id="btn-back" class="h-14 px-6 rounded-xl border-2 border-primary/30 text-primary font-label-md hidden">Geri</button>
    <button id="btn-next" class="flex-1 h-14 bg-gradient-to-r from-primary to-secondary text-white font-headline-md rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2">
      Devam <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </div>
</div>

<script type="module" src="/js/pages/onboarding.js?v=4"></script>
</body>
</html>
