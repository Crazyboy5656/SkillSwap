<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>İstek Oluştur - SkillSwap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="/css/app.css"/>
<script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Spline+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {
                    "colors": {
                        "primary-fixed-dim": "#c3c0ff",

                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "on-surface": "#111c2d",
                        "tertiary": "#00505f",
                        "on-background": "#111c2d",
                        "on-secondary-fixed-variant": "#6800b4",
                        "tertiary-fixed": "#acedff",
                        "inverse-surface": "#263143",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#ecf1ff",
                        "surface-tint": "#4d44e3",
                        "outline": "#777587",
                        "on-tertiary-container": "#93e8ff",
                        "on-tertiary-fixed": "#001f26",
                        "on-primary-fixed": "#0f0069",
                        "outline-variant": "#c7c4d8",
                        "surface": "#f9f9ff",
                        "surface-container-low": "#f0f3ff",
                        "on-primary-container": "#dad7ff",
                        "error": "#ba1a1a",
                        "secondary-container": "#9e41f5",
                        "primary-fixed": "#e2dfff",
                        "tertiary-fixed-dim": "#4cd7f6",
                        "secondary-fixed": "#f0dbff",
                        "on-surface-variant": "#464555",
                        "surface-container": "#e7eeff",
                        "inverse-primary": "#c3c0ff",
                        "background": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "error-container": "#ffdad6",
                        "surface-dim": "#cfdaf2",
                        "surface-container-highest": "#d8e3fb",
                        "on-tertiary-fixed-variant": "#004e5c",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#4f46e5",
                        "surface-container-high": "#dee8ff",
                        "on-secondary-fixed": "#2c0051",
                        "secondary": "#831ada",
                        "surface-variant": "#d8e3fb",
                        "tertiary-container": "#006a7c",
                        "secondary-fixed-dim": "#ddb8ff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#fffbff"
                    },
                    "borderRadius": {

                    },
                    "fontFamily": {

                }
            }
        }

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style id="nav-active-style">
[data-nav-id="nav-create"] { color: #4f46e5 !important; }
[data-nav-id="nav-create"] .nav-icon { background: rgba(79,70,229,0.13) !important; font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24 !important; }
[data-nav-id="nav-create"] .nav-label { font-weight: 800 !important; color: #4f46e5 !important; }
</style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-4 h-16 bg-white/70 backdrop-blur-xl border-b border-slate-200/50 shadow-sm">
<div class="flex items-center gap-4 w-full max-w-2xl mx-auto">
<button onclick="history.back()" class="p-2 rounded-full hover:bg-slate-100/50 transition-colors active:scale-95 duration-200 text-indigo-600">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Oluştur</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin w-full max-w-2xl mx-auto">
<!-- Hero Section Aesthetic -->
<div class="mb-xl text-center">
<div class="inline-block p-xs px-md rounded-full bg-secondary-fixed text-on-secondary-fixed-variant font-label-sm mb-base">
                YENİ İSTEK
            </div>
<h2 class="font-headline-lg text-headline-lg text-primary mb-xs">Öğrenmek İstiyorum</h2>
<p class="text-on-surface-variant font-body-md">Hangi yeteneği öğrenmek istediğini paylaş.</p>
</div>
<form id="create-form" class="space-y-lg">
<!-- Title Input -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant ml-xs">Ders Başlığı</label>
<input class="w-full h-12 px-md bg-slate-50 border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-on-surface font-body-md" placeholder="Örn: Temel Gitar Eğitimi" type="text"/>
</div>
<!-- Description Text Area -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant ml-xs">Ders Açıklaması</label>
<textarea class="w-full p-md bg-slate-50 border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-on-surface font-body-md resize-none" placeholder="Dersin içeriği hakkında kısa bir bilgi ver..." rows="4"></textarea>
</div>
<!-- Tag Selection -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-xs">Kategori Seç</label>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-base rounded-full bg-primary text-on-primary font-label-md shadow-sm active:scale-95 transition-transform" type="button">Müzik</button>
<button class="px-md py-base rounded-full bg-surface-container-high text-on-surface-variant font-label-md hover:bg-slate-200 transition-colors active:scale-95" type="button">Spor</button>
<button class="px-md py-base rounded-full bg-surface-container-high text-on-surface-variant font-label-md hover:bg-slate-200 transition-colors active:scale-95" type="button">Yazılım</button>
<button class="px-md py-base rounded-full bg-surface-container-high text-on-surface-variant font-label-md hover:bg-slate-200 transition-colors active:scale-95" type="button">Dil</button>
<button class="px-md py-base rounded-full bg-surface-container-high text-on-surface-variant font-label-md hover:bg-slate-200 transition-colors active:scale-95" type="button">Sanat</button>
</div>
</div>
<!-- Date and Location Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant ml-xs">Uygun Tarih Aralığı</label>
<div class="relative">
<input class="w-full h-12 pl-12 pr-md bg-slate-50 border-outline-variant rounded-xl focus:ring-2 focus:ring-primary transition-all outline-none text-on-surface font-body-md" placeholder="Tarih seçiniz" type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant ml-xs">Mekan (Opsiyonel)</label>
<div class="relative">
<input class="w-full h-12 pl-12 pr-md bg-slate-50 border-outline-variant rounded-xl focus:ring-2 focus:ring-primary transition-all outline-none text-on-surface font-body-md" placeholder="Konum veya Online" type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary" data-icon="location_on">location_on</span>
</div>
</div>
</div>
<!-- Gamified Preview Card (Asymmetric Layout) -->
<div class="mt-xl p-lg rounded-2xl glass-card relative overflow-hidden group">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full -mr-16 -mt-16 blur-3xl"></div>
<div class="relative flex items-center gap-md">
<div class="w-16 h-16 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white shadow-lg">
<span class="material-symbols-outlined text-3xl" data-icon="school">school</span>
</div>
<div>
<h4 class="font-headline-md text-on-surface">Önizleme</h4>
<p class="font-body-sm text-on-surface-variant">Dersin listede böyle görünecek.</p>
</div>
<div class="ml-auto">
<div class="w-10 h-10 rounded-full border-2 border-white bg-accent-neon-lime flex items-center justify-center shadow-sm" style="background-color: #d4ff00;">
<span class="material-symbols-outlined text-black text-xl" data-icon="bolt" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom: Submit + Nav -->
<div class="fixed bottom-0 left-0 w-full z-50 flex flex-col">
  <div class="px-5 py-3 bg-white/90 backdrop-blur-md border-t border-slate-100/50">
    <button type="submit" form="create-form" class="w-full h-[52px] bg-gradient-to-r from-primary to-secondary text-on-primary font-headline-md rounded-xl shadow-lg shadow-primary/20 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2">
      <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span> İstek Gönder
    </button>
  </div>
  <nav class="flex justify-around items-center px-2 h-[72px] bg-white border-t border-slate-100 shadow-[0_-1px_10px_rgba(0,0,0,0.06)]">
    <a data-nav-id="nav-home" href="/home" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
      <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">home</span>
      <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Ana Sayfa</span>
    </a>
    <a data-nav-id="nav-search" href="/listings" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
      <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">search</span>
      <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Keşfet</span>
    </a>
    <a data-nav-id="nav-create" href="/create" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
      <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">add_box</span>
      <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Oluştur</span>
    </a>
    <a data-nav-id="nav-messages" href="/chat" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
      <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">chat</span>
      <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Mesajlar</span>
    </a>
    <a data-nav-id="nav-profile" href="/profile" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
      <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">account_circle</span>
      <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Profilim</span>
    </a>
  </nav>
</div>
<script type="module" src="/js/pages/create.js?kind=learn"></script>
</body></html>
