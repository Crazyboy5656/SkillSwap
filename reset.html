<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                extend: {

                        "secondary": "#831ada",

                        "surface-dim": "#cfdaf2",
                        "on-tertiary": "#ffffff",
                        "background": "#f9f9ff",
                        "primary": "#3525cd",
                        "outline-variant": "#c7c4d8",
                        "on-surface-variant": "#464555",
                        "inverse-surface": "#263143",
                        "secondary-container": "#9e41f5",
                        "on-primary-container": "#dad7ff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#4cd7f6",

                        "tertiary": "#00505f",
                        "surface": "#f9f9ff",
                        "on-background": "#111c2d",
                        "on-secondary-fixed": "#2c0051",
                        "error": "#ba1a1a",
                        "on-surface": "#111c2d",
                        "on-tertiary-fixed": "#001f26",

                        "on-primary-fixed": "#0f0069",
                        "error-container": "#ffdad6",

                        "surface-container-high": "#dee8ff",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-variant": "#d8e3fb",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "inverse-on-surface": "#ecf1ff",
                        "on-tertiary-fixed-variant": "#004e5c",

                    },
                    "fontFamily": {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary/10 blur-[150px]"></div>
<div class="absolute -bottom-[10%] left-[20%] w-[35%] h-[35%] rounded-full bg-tertiary-fixed/20 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex items-center justify-center p-margin">
<div class="w-full max-w-md">
<!-- Branding Header (Suppressed Shell Navigation but Keeping Brand Context) -->
<div class="text-center mb-xl">
<span class="font-headline-xl text-headline-xl bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent inline-block mb-xs">SkillSwap</span>
<div class="flex items-center justify-center gap-xs">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="text-on-surface-variant font-label-sm tracking-widest uppercase">Teens Platform</span>
</div>
</div>
<!-- Reset Password Card -->
<div class="glass-panel border border-white/50 rounded-[2rem] p-lg md:p-xl shadow-[0_8px_32px_rgba(79,70,229,0.12)]">
<div class="mb-xl text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Şifreni Sıfırla</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lütfen yeni şifreni belirle.</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault()">
<!-- New Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="new_password">Yeni şifre</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="w-full h-12 pl-12 pr-12 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md placeholder:text-outline/50" id="new_password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm New Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="confirm_password">Yeni şifre (tekrar)</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="lock_reset">lock_reset</span>
</div>
<input class="w-full h-12 pl-12 pr-12 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md placeholder:text-outline/50" id="confirm_password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Password Requirements Hint -->
<div class="p-md bg-surface-container/50 rounded-xl space-y-2">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-tertiary-container" data-icon="info">info</span>
                            Güvenlik İpuçları:
                        </p>
<ul class="text-[11px] font-medium text-on-surface-variant/80 space-y-1 ml-6 list-disc">
<li>En az 8 karakter uzunluğunda olmalı</li>
<li>En az bir büyük harf ve bir rakam içermeli</li>
</ul>
</div>
<!-- Primary Action Button -->
<div class="pt-sm">
<button class="w-full h-12 bg-gradient-to-r from-primary to-secondary text-on-primary font-label-md text-label-md rounded-xl shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-95 transition-all flex items-center justify-center gap-sm">
                            Şifre sıfırla
                            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Back to Login Link -->
</div>
<!-- Footer Decorative Illustration/Bento Card -->
</div>
</main>
<!-- Contextual Success Image (Hidden in Reset Phase, conceptually part of the layout flow) -->
<div class="hidden">
<img alt="Reset Success Illustration" src=""/>
</div>
<script type="module" src="/js/pages/reset.js?v=3"></script>
</body></html>
