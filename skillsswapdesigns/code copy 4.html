<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Spline+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c7c4d8",
                    "on-secondary-fixed-variant": "#6800b4",
                    "secondary-fixed-dim": "#ddb8ff",
                    "secondary-container": "#9e41f5",
                    "surface-variant": "#d8e3fb",
                    "on-tertiary-container": "#93e8ff",
                    "on-tertiary-fixed-variant": "#004e5c",
                    "secondary": "#831ada",
                    "on-secondary": "#ffffff",
                    "primary": "#3525cd",
                    "inverse-on-surface": "#ecf1ff",
                    "surface-container-highest": "#d8e3fb",
                    "on-primary-fixed-variant": "#3323cc",
                    "on-primary-fixed": "#0f0069",
                    "outline": "#777587",
                    "on-tertiary-fixed": "#001f26",
                    "on-surface": "#111c2d",
                    "on-error": "#ffffff",
                    "tertiary": "#00505f",
                    "primary-fixed-dim": "#c3c0ff",
                    "on-primary-container": "#dad7ff",
                    "tertiary-fixed": "#acedff",
                    "tertiary-container": "#006a7c",
                    "surface-tint": "#4d44e3",
                    "surface-container": "#e7eeff",
                    "on-surface-variant": "#464555",
                    "secondary-fixed": "#f0dbff",
                    "surface-container-high": "#dee8ff",
                    "surface": "#f9f9ff",
                    "on-error-container": "#93000a",
                    "tertiary-fixed-dim": "#4cd7f6",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "background": "#f9f9ff",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#cfdaf2",
                    "surface-bright": "#f9f9ff",
                    "on-secondary-container": "#fffbff",
                    "surface-container-low": "#f0f3ff",
                    "on-background": "#111c2d",
                    "error": "#ba1a1a",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#e2dfff",
                    "on-secondary-fixed": "#2c0051",
                    "inverse-primary": "#c3c0ff",
                    "primary-container": "#4f46e5",
                    "inverse-surface": "#263143"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "xl": "32px",
                    "lg": "24px",
                    "2xl": "48px",
                    "sm": "12px",
                    "margin": "20px",
                    "base": "8px",
                    "gutter": "16px",
                    "md": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Plus Jakarta Sans"],
                    "headline-lg": ["Spline Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "body-sm": ["Plus Jakarta Sans"],
                    "headline-md": ["Spline Sans"],
                    "label-sm": ["Plus Jakarta Sans"],
                    "headline-xl": ["Spline Sans"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "30px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]

          },
        },
      }

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .vibrant-bg {
            background: radial-gradient(circle at top left, #e2dfff 0%, transparent 40%),
                        radial-gradient(circle at bottom right, #f0dbff 0%, transparent 40%),
                        #f9f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="vibrant-bg min-h-screen flex flex-col font-body-md text-on-background">
<header class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/50 shadow-sm shadow-indigo-500/10">
<div class="flex items-center justify-between px-5 h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-indigo-600" data-icon="arrow_back">arrow_back</span>
<span class="font-['Spline_Sans'] text-xl font-extrabold bg-gradient-to-r from-indigo-600 to-purple-500 bg-clip-text text-transparent">SkillSwap Teens</span>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-margin">
<div class="w-full max-w-md">
<div class="glass-card rounded-[32px] p-xl shadow-xl shadow-indigo-500/5 relative overflow-hidden group">
<div class="absolute -top-24 -right-24 w-48 h-48 bg-secondary-fixed-dim/30 rounded-full blur-3xl group-hover:bg-secondary-fixed-dim/40 transition-all duration-500"></div>
<div class="absolute -bottom-24 -left-24 w-48 h-48 bg-primary-fixed-dim/30 rounded-full blur-3xl group-hover:bg-primary-fixed-dim/40 transition-all duration-500"></div>
<div class="relative z-10 space-y-lg text-center">
<div class="w-20 h-20 bg-primary-container rounded-3xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/20 transform -rotate-3 hover:rotate-0 transition-transform duration-300">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
<div class="space-y-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Şifremi Unuttum</h1>
<p class="font-body-md text-on-surface-variant px-md">Endişelenme! E-posta adresini gir, sana şifreni sıfırlaman için bir bağlantı gönderelim.</p>
</div>
<form class="space-y-lg text-left pt-base">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="email">E-posta</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-0 ring-1 ring-outline-variant focus:ring-2 focus:ring-primary rounded-xl transition-all font-body-md text-on-surface" id="email" placeholder="ornek@okul.com" type="email"/>
</div>
</div>
<button class="w-full h-14 bg-gradient-to-r from-primary to-secondary text-on-primary font-label-md text-md rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-base" type="submit">
<span>Link gönder</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</form>
<div class="pt-base">
<a class="inline-flex items-center gap-xs font-label-md text-primary hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="chevron_left">chevron_left</span>
                            Giriş yap
                        </a>
</div>
</div>
</div>
</div>
</main>
<footer class="mt-auto p-margin text-center">
<p class="font-label-sm text-slate-400">© 2024 SkillSwap Teens. Geleceği birlikte inşa ediyoruz.</p>
</footer>
<div class="fixed top-20 right-10 w-64 h-64 bg-tertiary-fixed-dim/20 rounded-full blur-3xl -z-10 animate-pulse"></div>
<div class="fixed bottom-20 left-10 w-80 h-80 bg-secondary-fixed-dim/20 rounded-full blur-3xl -z-10 animate-pulse" style="animation-delay: 1s;"></div>
</body></html>
