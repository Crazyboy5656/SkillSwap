<!DOCTYPE html>
<html class="light" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillSwap — Bildirimler</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css"/>
<script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{
    colors:{"primary":"#3525cd","secondary":"#831ada","primary-container":"#4f46e5","on-primary":"#ffffff","surface":"#f9f9ff","surface-container-low":"#f0f3ff","surface-container":"#e7eeff","surface-container-high":"#dee8ff","on-surface":"#111c2d","on-surface-variant":"#464555","outline-variant":"#c7c4d8","outline":"#777587","background":"#f9f9ff","primary-fixed":"#e2dfff","on-primary-fixed-variant":"#3323cc"},
    fontFamily:{"headline-md":["Spline Sans"],"headline-lg":["Spline Sans"],"body-md":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"]},
    fontSize:{"headline-md":["24px",{"lineHeight":"30px","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"38px","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["14px",{"lineHeight":"18px","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"700"}]},
    spacing:{"xs":"4px","sm":"12px","base":"8px","md":"16px","lg":"24px","xl":"32px","2xl":"48px","margin":"20px","gutter":"16px"}
  }}
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  body{min-height:max(884px,100dvh);}
</style>
</head>
<body class="bg-background font-body-md text-on-surface pb-32">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/50 flex items-center justify-between px-4 h-16 shadow-sm">
  <button class="p-2 text-indigo-600" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
  <h1 class="font-['Spline_Sans'] font-bold text-lg text-indigo-600 flex items-center gap-2 justify-center"><img src="/images/skillswap-logo.png" alt="" width="128" height="128" class="h-7 w-auto object-contain" aria-hidden="true"/>Bildirimler</h1>
  <button id="btn-mark-all" class="px-3 py-1.5 text-primary font-label-sm rounded-xl hover:bg-indigo-50 transition-all">Tümünü Oku</button>
</header>

<main class="pt-20 px-5 max-w-lg mx-auto">

  <!-- Pending match requests section -->
  <section id="requests-section" class="hidden mb-6">
    <h2 class="font-label-md text-on-surface-variant uppercase tracking-widest mb-3">İlanlara Gelen Başvurular</h2>
    <div id="requests-list" class="space-y-3"></div>
  </section>

  <!-- Notifications list -->
  <section>
    <h2 class="font-label-md text-on-surface-variant uppercase tracking-widest mb-3">Bildirimler</h2>
    <div id="notif-list" class="space-y-3">
      <div class="skeleton h-20 rounded-2xl"></div>
      <div class="skeleton h-20 rounded-2xl"></div>
      <div class="skeleton h-20 rounded-2xl"></div>
    </div>
  </section>

</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 h-[72px] bg-white border-t border-slate-100 shadow-[0_-1px_10px_rgba(0,0,0,0.06)]">
  <a data-nav-id="nav-home" href="/home" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">home</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Ana Sayfa</span>
  </a>
  <a data-nav-id="nav-search" href="/listings" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">search</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Keşfet</span>
  </a>
  <a data-nav-id="nav-create" href="/create" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">add_box</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Oluştur</span>
  </a>
  <a data-nav-id="nav-messages" href="/chat" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">chat</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Mesajlar</span>
  </a>
  <a data-nav-id="nav-profile" href="/profile" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">account_circle</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Profilim</span>
  </a>
</nav>

<script type="module" src="/js/pages/notifications.js?v=4"></script>
</body>
</html>
