<!DOCTYPE html>
<html class="light" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillSwap — Tüm İlanlar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css"/>
<script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{
    colors:{"primary":"#3525cd","secondary":"#831ada","primary-container":"#4f46e5","on-primary":"#ffffff","surface":"#f9f9ff","surface-container-low":"#f0f3ff","surface-container":"#e7eeff","surface-container-high":"#dee8ff","surface-container-highest":"#d8e3fb","on-surface":"#111c2d","on-surface-variant":"#464555","outline-variant":"#c7c4d8","outline":"#777587","background":"#f9f9ff","secondary-container":"#9e41f5","tertiary-container":"#006a7c","primary-fixed":"#e2dfff","on-primary-container":"#dad7ff","on-primary-fixed-variant":"#3323cc"},
    fontFamily:{"headline-xl":["Spline Sans"],"headline-lg":["Spline Sans"],"headline-md":["Spline Sans"],"body-md":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"]},
    fontSize:{"headline-xl":["40px",{"lineHeight":"48px","fontWeight":"700"}],"headline-lg":["32px",{"lineHeight":"38px","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"30px","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-md":["14px",{"lineHeight":"18px","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"700"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}]},
    spacing:{"xs":"4px","sm":"12px","base":"8px","md":"16px","lg":"24px","xl":"32px","2xl":"48px","margin":"20px","gutter":"16px"}
  }}
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  body{min-height:max(884px,100dvh);}
</style>
<style id="nav-active-style">
[data-nav-id="nav-search"] { color: #4f46e5 !important; }
[data-nav-id="nav-search"] .nav-icon { background: rgba(79,70,229,0.13) !important; font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24 !important; }
[data-nav-id="nav-search"] .nav-label { font-weight: 800 !important; color: #4f46e5 !important; }
</style>
</head>
<body class="bg-background font-body-md text-on-surface pb-32">

<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/50 flex items-center justify-between px-4 h-16 shadow-sm">
  <button class="p-2 text-indigo-600" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button>
  <h1 class="font-['Spline_Sans'] font-bold text-lg text-indigo-600 flex items-center gap-2 justify-center"><img src="/images/skillswap-logo.png" alt="" width="128" height="128" class="h-7 w-auto object-contain" aria-hidden="true"/>Keşfet</h1>
  <button class="p-2 text-slate-500 relative" onclick="location.href='/notifications'">
    <span class="material-symbols-outlined">notifications</span>
    <span id="notif-badge" class="absolute top-1 right-1 min-w-[14px] h-3.5 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center px-0.5" hidden>0</span>
  </button>
</header>

<main class="pt-20 px-5 max-w-2xl mx-auto space-y-5">

  <!-- Search bar -->
  <div class="relative">
    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
    <input id="search-input" type="text" placeholder="Yetenek veya başlık ara..." class="w-full h-12 pl-12 pr-4 bg-surface-container-low rounded-2xl border-none focus:ring-2 focus:ring-primary font-label-md outline-none"/>
  </div>


  <!-- Category filter chips -->
  <div id="cat-chips" class="flex overflow-x-auto gap-2 hide-scrollbar -mx-5 px-5 pb-1">
    <div class="skeleton flex-shrink-0 w-16 h-8 rounded-full"></div>
    <div class="skeleton flex-shrink-0 w-20 h-8 rounded-full"></div>
    <div class="skeleton flex-shrink-0 w-16 h-8 rounded-full"></div>
  </div>

  <!-- Mode filter -->
  <div class="flex gap-2">
    <button data-mode="all"       class="mode-tab px-4 py-1.5 rounded-full font-label-sm border-2 border-primary bg-primary/10 text-primary">Tümü</button>
    <button data-mode="online"    class="mode-tab px-4 py-1.5 rounded-full font-label-sm border-2 border-outline-variant text-on-surface-variant">🌐 Online</button>
    <button data-mode="in_person" class="mode-tab px-4 py-1.5 rounded-full font-label-sm border-2 border-outline-variant text-on-surface-variant">📍 Yüz yüze</button>
  </div>

  <!-- Listings grid -->
  <div id="listings-grid" class="space-y-4">
    <div class="skeleton h-32 rounded-3xl"></div>
    <div class="skeleton h-32 rounded-3xl"></div>
    <div class="skeleton h-32 rounded-3xl"></div>
  </div>

  <!-- Load more -->
  <div class="text-center py-4">
    <button id="btn-load-more" class="px-8 py-3 border-2 border-primary/30 text-primary font-label-md rounded-xl hidden">Daha Fazla Yükle</button>
  </div>

</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 h-[72px] bg-white border-t border-slate-100 shadow-[0_-1px_10px_rgba(0,0,0,0.06)]">
  <a data-nav-id="nav-home" href="/home" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">home</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Ana Sayfa</span>
  </a>
  <a data-nav-id="nav-search" href="/listings" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">search</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Keşfet</span>
  </a>
  <a data-nav-id="nav-create" href="/create" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">add_box</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Oluştur</span>
  </a>
  <a data-nav-id="nav-messages" href="/chat" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">chat</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Mesajlar</span>
  </a>
  <a data-nav-id="nav-profile" href="/profile" class="nav-link flex flex-col items-center justify-center flex-1 h-full text-slate-400 active:scale-95 transition-all">
    <span class="nav-icon material-symbols-outlined text-[24px] w-12 h-8 flex items-center justify-center rounded-[14px] transition-all">account_circle</span>
    <span class="nav-label font-['Spline_Sans'] text-[11px] font-semibold mt-0.5">Profilim</span>
  </a>
</nav>

<script type="module" src="/js/pages/listings.js?v=4"></script>
</body>
</html>
