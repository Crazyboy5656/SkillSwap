<!-- Header Branding -->
<div class="text-center mb-xl flex flex-col items-center gap-3">
<img src="/images/skillswap-logo.png" alt="SkillSwap" width="200" height="200" class="h-16 w-auto object-contain"/>
<p class="font-label-md text-label-md text-secondary uppercase tracking-[0.2em]">Teens Ecosystem</p>
</div>
<!-- Registration Card -->
<div class="glass-card border border-white/40 rounded-3xl p-lg vibrant-glow">
<header class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Hesap Oluştur</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Yeni beceriler keşfetmek için aramıza katıl!</p>
</header>
<form id="register-form" class="space-y-md">
<!-- Username Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface ml-1">Kullanıcı adı</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]" data-icon="person">person</span>
<input id="input-name" class="w-full h-12 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/30 transition-all font-body-md text-on-surface placeholder:text-outline-variant" placeholder="Örnekİsim" type="text" autocomplete="name"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface ml-1">E-posta</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]" data-icon="alternate_email">alternate_email</span>
<input id="input-email" class="w-full h-12 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/30 transition-all font-body-md text-on-surface placeholder:text-outline-variant" placeholder="merhaba@skillswap.com" type="email" autocomplete="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface ml-1">Şifre</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]" data-icon="lock">lock</span>
<input id="input-password" class="w-full h-12 pl-12 pr-12 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/30 transition-all font-body-md text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password" autocomplete="new-password"/>
<button class="absolute right-4 text-outline hover:text-primary transition-colors" type="button" id="toggle-pw1">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface ml-1">Şifre (tekrar)</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]" data-icon="lock_reset">lock_reset</span>
<input id="input-confirm" class="w-full h-12 pl-12 pr-12 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/30 transition-all font-body-md text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password" autocomplete="new-password"/>
<button class="absolute right-4 text-outline hover:text-primary transition-colors" type="button" id="toggle-pw2">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Terms -->
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-4 leading-relaxed">
                    Kaydolarak <span class="text-primary font-bold cursor-pointer hover:underline">Kullanım Koşullarını</span> ve <span class="text-primary font-bold cursor-pointer hover:underline">Gizlilik Politikasını</span> kabul etmiş sayılırsın.
                </p>
<!-- Primary Action Button -->
<button id="btn-register-submit" class="w-full h-[52px] vibrant-gradient text-on-primary font-headline-md text-body-lg rounded-2xl shadow-xl shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-lg" type="submit">
                    Kaydol

</button>
